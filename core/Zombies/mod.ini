[mod]
name = Zombies
author = whompay
version = 0.13
description = Built in. Zombies game mode for multiplayer (synced to every player: zombies, rounds, points, doors, wall weapons): in a lobby, Mode: Zombies (left of Gangsta Brawl). Rounds of zombies on the map, a countdown before each round, points for the damage you do.

[settings]
; Points for each point of damage done to a zombie (decimals allowed).
points_per_damage = 1
; Bonus for a kill (a melee kill gets twice this).
points_kill = 50
; Seconds before the first round, and between rounds.
first_round_delay = 10
round_break = 8
; Most zombies alive at once (4-32). Below that: 6 + 3 per round. A round has 6 more zombies than the one before (6, 12, 18, ...).
max_alive = 24
; Zombie health in round 1, and how much more each round up to round 9 (then x1.1 per round). A pistol shot does about 70.
health_round1 = 150
health_per_round = 100
