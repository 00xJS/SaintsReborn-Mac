[mod]
name = First Person
author = whompay
version = 1.3
description = Press V to switch between the normal camera and a first person view at the player's eye height. Works on foot and in vehicles. Shops, cutscenes and other scripted scenes switch back to the normal camera by themselves.\n\nBuilt into Saints Reborn (always on). Change the settings under [settings] in core\\FirstPerson\\mod.ini next to saintsrow.exe. V no longer works as the right stick click (the middle mouse button still does).

[settings]
; Key that switches between first and third person.
key = V
; Start the game in first person.
start_in_first_person = false
; How far in front of the eyes the camera sits, in metres. Raise it if you see the inside of the head or hair.
forward_offset = 0.15
; Field of view in first person, in degrees (the game normally uses about 60). Wider shows more of your arms and weapon; 0 keeps the game's own.
fov = 75
; Eye height when standing, in metres.
eye_height = 1.62
; Eye height when crouching, in metres.
crouch_eye_height = 1.05
; Eye height when sitting in a vehicle, in metres (only used if the skeleton can't be read).
vehicle_eye_height = 1.1
; Moves the camera down (negative) or up in vehicles, in metres.
vehicle_height_offset = -0.03
; How much further forward the camera moves when looking straight down, in metres.
look_down_offset = 0.25
; Turn the body to face where you look while on foot (false = the game turns it towards where you walk). Walking sideways or back (A/D/S) always lets the game turn the body.
body_follows_camera = true
; Moves the camera sideways in vehicles, in metres (positive = to the right, towards the middle of the car).
vehicle_side_offset = 0.08
; In vehicles: how far in front of the eyes the camera sits along the view, in metres.
vehicle_forward_offset = 0.09
; In vehicles: extra distance out of the head when looking sideways or back, in metres (full amount when looking straight back).
vehicle_turn_offset = 0.18
; How far the view can turn away from where the vehicle points, in degrees (enough to look over a shoulder).
vehicle_look_limit = 115
; How far up and down the view can tilt in vehicles, in degrees.
vehicle_look_up = 35
vehicle_look_down = 45
; Moves the camera up (positive) or down (negative), in metres, on top of the above.
height_offset = 0.0
; While swimming: how far above the water line the view stays, in metres, and
; how much it bobs.
swim_camera_height = 0.25
swim_bob = 0.04
; Write camera positions to mods/wml.log every few seconds.
debug = false
