[mod]
name = Whompays Co-op
author = whompay
version = 2.2.14
description = Co-op 2.2.14 (in progress): up to 12 players. F6 opens the co-op overlay. 1 = host (direct IP), 4 = host online (shows a join code), 2 = join: put the host's IP or join code in join_ip.txt first. 3 = stop, 5 = a copy of you for testing. Every player needs this co-op 2.2.8 or later build (protocol 8: 2.1 and earlier 2.2 builds can't join).

[settings]
; Your name in online sessions (empty = your Windows user name).
name = 
port = 27015


avatar = player
; 1 = the other player's body sliders (size, build) are applied to their character (needs own_body)
body = 1
; 1 = the other player gets their own body model (multiplayer's StyleTest_PC_MP slots) so body shapes don't leak between players
own_body = 1
; 1 = diagnostic for the body shape: overlay key 5 (player copy) copies your body sliders to the copy and logs what changed
body_test = 1
damage_forward = 0
; 1 = you see the other players' guns, shots, throws, rockets and explosions; 0 = off: their characters are never given a gun
shooting = 1
; 1 = other players' characters are moved the way the game moves its own player and multiplayer's remote players (a stick input every update), so they walk, run, strafe, back-pedal and aim-walk with their legs; 0 = move orders along their path, as 2.1 (their legs stood still while their player walked with the gun up)
walk = 1
; 1 = notoriety per player: each player has their own stars, every game's police and gangs go after the wanted player, crimes seen in another game count for the player who did them, only the player the cops arrest is busted, and the host's police response (its cars and helicopter, the gangs' cars) comes for the wanted player near the host, whose own police are off while their character stands in the host's game; 0 = off: no stars sync, no crime credit, arrests or police steering across games - the host's stars still rise for the crimes seen in its game, as in 2.0, and a client near the host runs its own police. Either way, hits on your character from the host's people (its police response's units and traffic crews too) come across
police = 1
; 1 = faster memory checks (built in from Co-op Car Guard: under Wine QueryWorkingSetEx is skipped once it never answers, VirtualQuery answers kept 500 ms); 0 = off
memory_speedup = 1
; shared = while the players are close, both see the host's traffic; own = each game has its own
traffic = shared
; shared = while the players are close, both see the host's pedestrians; own = each game has its own
peds = shared
; 2.2: 1 = while you are in the host's area (the host decides: member_join_m / member_leave_m below) you see the host's world stream: the
; host's cars and people (its game makes them around you too) made once here, moved 20 times a second, faded when they go; 2.1's traffic and people streams aren't sent to you
; then. 0 = 2.1's streams as before (on the host: no world stream is sent, every player gets 2.1's streams). Set it the same on every game.
; world = 0 is 2.1.4 for the tests' fallback, people_level0 below included; still on with 0: the car copies' model reference given back when
; they go, the host keeping the cars another player sits in, the pulled-out drivers removed after a session (fixes), the shared world registry.
world = 1
; 2.2, a client with world = 1: 1 = while you see the host's people, its people models are asked for at level 0 and the people-model slots
; your own game doesn't ask at go there (your homies, mission people, police and gangs keep theirs; the game's own table back when you
; stop seeing them); 0 = 2.1.4: asked for at the top level, the game's slots left as they are.
people_level0 = 1
; 2.2, the host: its upload for the shared area's world stream, in kbit/s, shared by the players in its area: each gets at least 6 KB/s
; (more than the setting in all when many players share it) and at most 24 KB/s, 20 updates a second within that; halved for 2 s while a
; player's link falls behind. 2.1's traffic and people streams go only to players with world = 0.
world_upload_kbps = 1000
; 2.2, the host: a player (with world = 1) joins the host's area within member_join_m metres of the host's character for 2 s and leaves it
; past member_leave_m for 5 s (40-400, leave at least join + 20). In the area that player's own traffic, people and police are off and the
; host's are shown; another player's character is kept to member_leave_m + 30 m. Set them the same on every game.
member_join_m = 150
member_leave_m = 200
; 2.2, the host: its game also makes the area's content around each player in it (the parked cars within 80 m, traffic and people near their
; camera), from the area's one street (12 cars, 26 people, 6 parked): 1 = parked cars, 2 = traffic, 4 = people, added (7 = all; 0 = none,
; what the host made is only kept alive near them). The traffic and people passes need traffic = shared / peds = shared on the host.
member_spawns = 7
; 2.2, the host: how much the street grows per player in the area (the game's wanted traffic and people x (1 + member_density x players),
; never past the game's own 12 cars / 26 people, never below what the game wants; a street a mission emptied stays empty); 0 = the host's street is shared as it is
member_density = 1.0
; 2.2: 1 = what the host's world does shows on the players in its area: its people's gunfire (their rounds played on their copies: flash,
; sound, tracers, the trigger held and let go; the hits stay the host's), its cars' brake and reverse lights, horns and steering, burning
; people, exploding props and cars' second explosions, its people's rockets and grenades; and your bullets on the host's cars count there.
; 0 = off on this game, sent and shown alike.
world_actions = 1
; host = story missions follow the host (the joiner is brought over, and can't start missions); own = each game its own
missions = host
; shared = the joiner sees the host's cutscenes too (a host skip skips both); own = only the host sees them
cutscenes = shared
; EXPERIMENTAL, keep at 1: more people models at once (2-4). 3 froze the game when entering the world.
; Both players need the same value. Restart the game after changing it.
people_models = 1
; EXPERIMENTAL, keep at 1: memory for people models, times the normal amount. 2 crashed in the player creator.
people_memory = 1
; How copies of the host's people are made: 0 = scripted (the game leaves them alone), 3 = passers-by (the game removes them on its own).
copy_kind = 0
; 1 = the game may not remove copies of the host's people on its own (stops popping in and out). 0 = allowed.
keep_copies = 1
; 1 = diagnostic: log people left on a car's getting-in/out list who belong to another car ("Car list check:" lines)
debug_cars = 0
