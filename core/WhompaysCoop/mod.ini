[mod]
name = Whompays Co-op
author = whompay
version = 2.1.2
description = Co-op 2.1: up to 12 players. F6 opens the co-op overlay. 1 = host (direct IP), 4 = host online (shows a join code), 2 = join: put the host's IP or join code in join_ip.txt first. 3 = stop, 5 = a copy of you for testing. Every player needs co-op 2.1.2.

[settings]
; Your name in online sessions (empty = your Windows user name).
name = 
port = 27015


avatar = player
; 1 = the other player's body sliders (size, build) are applied to their character (needs own_body)
body = 1
; 1 = the other player gets their own body model (multiplayer's StyleTest_PC_MP slots) so body shapes don't leak between players
own_body = 1
; 1 = diagnostic for the body shape: overlay key 5 (player copy) copies your body sliders to the copy and logs what changed
body_test = 1
damage_forward = 0
; 1 = you see the other players' guns, shots, throws, rockets and explosions; 0 = off: their characters are never given a gun
shooting = 1
; 1 = notoriety per player: each player has their own stars, every game's police and gangs go after the wanted player, crimes seen in another game count for the player who did them, only the player the cops arrest is busted, and the host's police response (its cars and helicopter, the gangs' cars) comes for the wanted player near the host, whose own police are off while their character stands in the host's game; 0 = off: no stars sync, no crime credit, arrests or police steering across games - the host's stars still rise for the crimes seen in its game, as in 2.0, and a client near the host runs its own police. Either way, hits on your character from the host's people (its police response's units and traffic crews too) come across
police = 1
; 1 = faster memory checks (built in from Co-op Car Guard: under Wine QueryWorkingSetEx is skipped once it never answers, VirtualQuery answers kept 500 ms); 0 = off
memory_speedup = 1
; shared = while the players are close, both see the host's traffic; own = each game has its own
traffic = shared
; shared = while the players are close, both see the host's pedestrians; own = each game has its own
peds = shared
; host = story missions follow the host (the joiner is brought over, and can't start missions); own = each game its own
missions = host
; shared = the joiner sees the host's cutscenes too (a host skip skips both); own = only the host sees them
cutscenes = shared
; EXPERIMENTAL, keep at 1: more people models at once (2-4). 3 froze the game when entering the world.
; Both players need the same value. Restart the game after changing it.
people_models = 1
; EXPERIMENTAL, keep at 1: memory for people models, times the normal amount. 2 crashed in the player creator.
people_memory = 1
; How copies of the host's people are made: 0 = scripted (the game leaves them alone), 3 = passers-by (the game removes them on its own).
copy_kind = 0
; 1 = the game may not remove copies of the host's people on its own (stops popping in and out). 0 = allowed.
keep_copies = 1
; 1 = diagnostic: log people left on a car's getting-in/out list who belong to another car ("Car list check:" lines)
debug_cars = 0
