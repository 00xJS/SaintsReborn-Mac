[mod]
name = Multiplayer
author = whompay
version = 0.4
description = Built in. The main menu's XBOX LIVE button becomes MULTIPLAYER, and Co-op can be played by a party of two.

[settings]
; Fewest players in multiplayer_levels.xtbl (Optimal_Players_Min). The real matchmaking start count is MULTIPLAYER > OPTIONS > Players to Start.
min_players = 2
; Largest party that can go into Co-op together in Player Match (the game allows 1).
coop_party = 2
; 1 = one player can start a System Link match alone (to try out maps).
solo_start = 1
