[mod]
name = Multiplayer
author = whompay
version = 0.2
description = Built in. The main menu's XBOX LIVE button becomes MULTIPLAYER, Quick Match starts with fewer players, and Co-op can be played by a party of two.

[settings]
; Fewest players Quick Match waits for before a match starts (the maps ask for 4 or 8). 1 = start alone (to try out maps).
min_players = 2
; Largest party that can go into Co-op together in Player Match (the game allows 1).
coop_party = 2
; 1 = one player can start a System Link match alone (to try out maps).
solo_start = 1
