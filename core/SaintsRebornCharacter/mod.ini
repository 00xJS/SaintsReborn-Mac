[mod]
name = Saints Reborn character
author = 00xJS, itsMJQ (SR Tweak Menu: the female body type, movement, voices, facial expressions, taunts and their data)
version = 0.2
description = Built in. Body Type in character creation, at the Plastic Surgeon and in the multiplayer export: a slider on the BODY page from male to female (Saints Row 2's body shape on your body and every stock piece of clothing, with breast physics). Movement styles, and a personality: voice, facial expression and D-pad taunts. Saved with your character.

[settings]
; Write Body Type changes and the shape's state to mods\wml.log.
debug = false
; Set true only with an SR2 hair mod that puts Medium Parted in Flat Top, Lightning's files (that hair then stays unshaped).
sr2_hair = false
